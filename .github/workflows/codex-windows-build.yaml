name: Codex Windows Build

on:
  push:
    branches:
      - codex/bitrate-average-10s
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: Release

      - name: Package plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: Release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-multi-rtmp-0.7.3.12-windows-x64
          path: release/obs-multi-rtmp-0.7.3.12-windows-x64.zip
          if-no-files-found: error
